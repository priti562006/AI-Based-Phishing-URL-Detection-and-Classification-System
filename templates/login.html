<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Phishing URL Detector</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-page">

    <div class="login-box">

        <!-- LEFT SIDE -->
        <div class="login-image">

            <div class="security-icon">
                🔐
            </div>

            <h1>
                AI-Based Phishing<br>
                URL Detection
            </h1>

            <p>
                Think Before You Click
            </p>

            <p>
                Detect. Prevent. Stay Secure.
            </p>

        </div>


        <!-- RIGHT SIDE -->
        <div class="login-form">

            <div class="logo">
                🛡️
            </div>

            <h2>
                Phishing URL Detector
            </h2>

            <p class="subtitle">
                Login to continue
            </p>


            {% if error %}

            <div class="error">
                {{ error }}
            </div>

            {% endif %}


            <form method="POST"
                  action="{{ url_for('login') }}">

                <div class="input-box">

                    <span>
                        👤
                    </span>

                    <input
                        type="text"
                        name="username"
                        placeholder="Username"
                        required>

                </div>


                <div class="input-box">

                    <span>
                        🔒
                    </span>

                    <input
                        type="password"
                        name="password"
                        placeholder="Password"
                        required>

                </div>


                <button
                    type="submit"
                    class="login-button">

                    Login

                </button>

            </form>


            <p class="admin-text">
                Don't have an account? Contact your admin.
            </p>

        </div>

    </div>

</body>

</html>
